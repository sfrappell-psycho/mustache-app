<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Moustache Cam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1008;
    --cream: #f5efe4;
    --gold: #c9a84c;
    --rust: #8b3a1a;
    --shadow: rgba(26,16,8,0.18);
  }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Lato', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    padding: 14px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0e0a04 0%, transparent 100%);
    position: relative;
    z-index: 10;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 2px 12px rgba(201,168,76,0.4);
  }

  header h1 span { color: var(--cream); }

  /* ── MAIN VIEWPORT ── */
  #viewport {
    position: relative;
    width: 100%;
    flex: 1;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video, canvas#overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  video { transform: scaleX(-1); } /* mirror front cam */

  canvas#overlay {
    pointer-events: none;
    z-index: 5;
  }

  /* ── STATUS BADGE ── */
  #status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: rgba(14,10,4,0.75);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 0.72rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    transition: opacity 0.4s;
    white-space: nowrap;
  }

  /* ── LOADING SPINNER ── */
  #loader {
    position: absolute;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: var(--gold);
    padding: 20px;
    text-align: center;
  }

  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(201,168,76,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'Lato', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  /* ── START BUTTON ── */
  #start-screen {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(14,10,4,0.92);
    padding: 30px;
    text-align: center;
  }

  #start-screen h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
  }

  #start-screen p {
    font-size: 0.85rem;
    color: var(--cream);
    opacity: 0.7;
    max-width: 260px;
    line-height: 1.6;
  }

  #btn-start {
    padding: 16px 40px;
    border-radius: 40px;
    border: 2px solid var(--gold);
    background: var(--gold);
    color: var(--ink);
    font-family: 'Lato', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  #btn-start:active { transform: scale(0.95); }

  #error-box {
    display: none;
    background: rgba(139,58,26,0.3);
    border: 1px solid var(--rust);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.78rem;
    color: #ffaa88;
    max-width: 280px;
    line-height: 1.5;
    text-align: left;
  }

  /* ── BOTTOM PANEL ── */
  #panel {
    width: 100%;
    background: linear-gradient(0deg, #0e0a04 60%, transparent 100%);
    padding: 12px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
    position: relative;
  }

  /* Style selector */
  #style-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    opacity: 0.7;
  }

  #style-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: none;
    justify-content: center;
  }
  #style-scroll::-webkit-scrollbar { display: none; }

  .style-btn {
    flex-shrink: 0;
    background: rgba(245,239,228,0.07);
    border: 1.5px solid rgba(201,168,76,0.3);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
    color: var(--cream);
    min-width: 80px;
  }

  .style-btn:hover, .style-btn.active {
    border-color: var(--gold);
    background: rgba(201,168,76,0.15);
    transform: translateY(-2px);
  }

  .style-btn.active { box-shadow: 0 0 14px rgba(201,168,76,0.3); }

  .style-icon {
    font-size: 1.6rem;
    line-height: 1;
  }

  .style-name {
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    text-align: center;
  }

  /* Action buttons */
  #actions {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }

  .btn {
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  #btn-capture {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: var(--cream);
    color: var(--ink);
    font-size: 0.65rem;
    font-weight: 700;
    box-shadow: 0 0 0 4px rgba(245,239,228,0.2), 0 4px 20px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  #btn-capture:active { transform: scale(0.93); }
  #btn-capture .cam-icon { font-size: 1.4rem; }

  #btn-share, #btn-reset {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(245,239,228,0.08);
    border: 1.5px solid rgba(245,239,228,0.2);
    color: var(--cream);
    font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
  }

  #btn-share:active, #btn-reset:active { transform: scale(0.9); }

  /* Captured snapshot overlay */
  #snapshot-wrap {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(14,10,4,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }

  #snapshot-wrap.show { display: flex; }

  #snapshot-img {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 14px;
    border: 2px solid var(--gold);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  #snap-actions {
    display: flex;
    gap: 14px;
  }

  .snap-btn {
    padding: 13px 28px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    transition: all 0.2s;
  }

  #snap-save {
    background: var(--gold);
    color: var(--ink);
  }

  #snap-close {
    background: rgba(245,239,228,0.1);
    color: var(--cream);
    border: 1.5px solid rgba(245,239,228,0.25);
  }

  #snap-save:active, #snap-close:active { transform: scale(0.95); }

  /* Mustache size control */
  #size-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  #size-row label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    flex-shrink: 0;
  }
  input[type=range] {
    -webkit-appearance: none;
    height: 3px;
    background: rgba(201,168,76,0.3);
    border-radius: 2px;
    flex: 1;
    max-width: 160px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Moustache<span>Cam</span></h1>
</header>

<div id="viewport">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status" style="display:none">Detecting…</div>

  <!-- Tap-to-start screen: required for camera on mobile Chrome -->
  <div id="start-screen">
    <h2>🎩 MoustacheCam</h2>
    <p>Tap below to start your camera and load the face-detection AI.</p>
    <button id="btn-start">📷 Start Camera</button>
    <div id="error-box"></div>
  </div>

  <div id="loader" style="display:none">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-text">Starting camera…</div>
  </div>
</div>

<div id="panel">
  <div id="style-label">Choose Your Moustache</div>
  <div id="style-scroll">
    <button class="style-btn active" data-style="pencil">
      <span class="style-icon">〜〜</span>
      <span class="style-name">Parted Pencil</span>
    </button>
    <button class="style-btn" data-style="handlebar">
      <span class="style-icon">🥸</span>
      <span class="style-name">Handlebar</span>
    </button>
    <button class="style-btn" data-style="walrus">
      <span class="style-icon">🦭</span>
      <span class="style-name">Walrus</span>
    </button>
    <button class="style-btn" data-style="chevron">
      <span class="style-icon">▼▼</span>
      <span class="style-name">Chevron</span>
    </button>
    <button class="style-btn" data-style="fu_manchu">
      <span class="style-icon">𝓕𝓜</span>
      <span class="style-name">Fu Manchu</span>
    </button>
  </div>

  <div id="size-row">
    <label>Size</label>
    <input type="range" id="size-slider" min="0.5" max="2.0" step="0.05" value="1.0">
  </div>

  <div id="actions">
    <button class="btn" id="btn-reset" title="Reset">↺</button>
    <button class="btn" id="btn-capture">
      <span class="cam-icon">📷</span>
      <span>Snap</span>
    </button>
    <button class="btn" id="btn-share" title="Share">⬆</button>
  </div>
</div>

<!-- Snapshot preview -->
<div id="snapshot-wrap">
  <img id="snapshot-img" alt="Your moustache photo">
  <div id="snap-actions">
    <button class="snap-btn" id="snap-save">💾 Save</button>
    <button class="snap-btn" id="snap-close">✕ Back</button>
  </div>
</div>

<!-- TensorFlow.js + Face Landmarks -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.5/dist/face-landmarks-detection.js"></script>

<script>
(async () => {
// ── Global state ─────────────────────────────────────────
  const video      = document.getElementById('video');
  const overlay    = document.getElementById('overlay');
  const ctx        = overlay.getContext('2d');
  const statusEl   = document.getElementById('status');
  const loader     = document.getElementById('loader');
  const loaderText = document.getElementById('loader-text');
  const startScreen = document.getElementById('start-screen');
  const errorBox   = document.getElementById('error-box');
  const sizeSlider = document.getElementById('size-slider');

  let detector = null;
  let currentStyle = 'pencil';
  let sizeMultiplier = 1.0;
  let animId = null;

  function showError(msg) {
    errorBox.style.display = 'block';
    errorBox.textContent = '⚠ ' + msg;
    loader.style.display = 'none';
    console.error('MoustacheCam error:', msg);
  }

  function setLoading(msg) {
    loader.style.display = 'flex';
    loaderText.textContent = msg;
  }

  // ── Start button: required user gesture for camera on Android ──
  document.getElementById('btn-start').addEventListener('click', async () => {
    startScreen.style.display = 'none';
    setLoading('Requesting camera…');

    // ── Camera ──────────────────────────────────────────────
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (e) {
      startScreen.style.display = 'flex';
      showError('Camera error: ' + e.name + ' — ' + e.message + '. Make sure you tapped Allow when prompted, and that no other app is using the camera.');
      return;
    }

    video.srcObject = stream;

    // Wait for video to be ready
    await new Promise((res, rej) => {
      video.onloadedmetadata = res;
      video.onerror = rej;
      setTimeout(() => rej(new Error('Video timeout')), 10000);
    }).catch(e => { showError('Video failed to start: ' + e.message); return null; });

    if (!video.videoWidth) {
      // try playing it
      try { await video.play(); } catch(e) {}
    }

    function resizeCanvas() {
      if (video.videoWidth > 0) {
        overlay.width  = video.videoWidth;
        overlay.height = video.videoHeight;
      }
    }
    resizeCanvas();

    // ── Load AI model ────────────────────────────────────────
    setLoading('Loading face AI…');
    try {
      detector = await faceLandmarksDetection.createDetector(
        faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,
        { runtime: 'tfjs', refineLandmarks: true, maxFaces: 1 }
      );
    } catch (e) {
      showError('AI model failed: ' + e.message);
      return;
    }

    loader.style.display = 'none';
    statusEl.style.display = 'block';
    statusEl.textContent = 'Point camera at your face';

    // ── Start render loop ────────────────────────────────────
    async function renderLoop() {
      resizeCanvas();
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      if (video.readyState >= 2 && overlay.width > 0) {
        try {
          const faces = await detector.estimateFaces(video, { flipHorizontal: false });
          if (faces.length > 0) {
            statusEl.textContent = '✓ Face detected';
            const keypoints = faces[0].keypoints;
            const drawer = MUSTACHE_DRAWERS[currentStyle];
            if (drawer) drawer(ctx, keypoints, sizeMultiplier);
          } else {
            statusEl.textContent = 'Point camera at your face';
          }
        } catch (e) {
          // silently continue on frame errors
        }
      }
      animId = requestAnimationFrame(renderLoop);
    }

    renderLoop();
  });

  // Placeholder so code below doesn't break before start
  function resizeCanvas() {
    if (video.videoWidth > 0) {
      overlay.width  = video.videoWidth;
      overlay.height = video.videoHeight;
    }
  }

  // ── Moustache drawing functions ──────────────────────────
  // MediaPipe face mesh landmark indices (478 points with refinement)
  // Key indices:
  //   Nose tip: 1
  //   Upper lip top center: 13 (inner lip) / 0 (outer)
  //   Left mouth corner: 61   Right mouth corner: 291
  //   Nose bottom left: 129   Nose bottom right: 358
  //   Philtrum center (base of nose): 94

  const MUSTACHE_DRAWERS = {
    pencil:    drawPencil,
    handlebar: drawHandlebar,
    walrus:    drawWalrus,
    chevron:   drawChevron,
    fu_manchu: drawFuManchu,
  };

  // Helper: get a landmark {x, y} scaled to canvas
  function lm(keypoints, idx) {
    const k = keypoints[idx];
    // keypoints come in video space; canvas is mirrored via CSS but we draw on raw coords
    return { x: overlay.width - k.x, y: k.y };
  }

  // ── PARTED PENCIL ────────────────────────────────────────
  function drawPencil(ctx, keypoints, scale) {
    // Anchor points
    const noseBase  = lm(keypoints, 94);   // base of nose / philtrum
    const lipTop    = lm(keypoints, 0);    // top of upper lip center
    const leftCorner  = lm(keypoints, 61);
    const rightCorner = lm(keypoints, 291);

    // Mid-point between nose base and lip top = moustache center
    const cx = (noseBase.x + lipTop.x) / 2;
    const cy = (noseBase.y + lipTop.y) / 2;

    // Width ~= mouth width * scale
    const mouthW = Math.abs(rightCorner.x - leftCorner.x);
    const w = mouthW * 0.42 * scale;   // each wing
    const gap = mouthW * 0.04;         // parting gap
    const h = w * 0.22;                // thickness
    const curve = h * 1.6;

    ctx.save();
    ctx.fillStyle = '#2a1a0a';
    ctx.strokeStyle = '#1a0e05';
    ctx.lineWidth = 1;

    // LEFT wing
    ctx.beginPath();
    ctx.moveTo(cx - gap, cy + h * 0.1);
    ctx.quadraticCurveTo(cx - gap - w * 0.4, cy - h * 0.5, cx - gap - w, cy + h * 0.2);
    ctx.quadraticCurveTo(cx - gap - w, cy + h * 0.9, cx - gap - w * 0.55, cy + h);
    ctx.quadraticCurveTo(cx - gap - w * 0.1, cy + h * 1.1, cx - gap, cy + h * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // RIGHT wing (mirror)
    ctx.beginPath();
    ctx.moveTo(cx + gap, cy + h * 0.1);
    ctx.quadraticCurveTo(cx + gap + w * 0.4, cy - h * 0.5, cx + gap + w, cy + h * 0.2);
    ctx.quadraticCurveTo(cx + gap + w, cy + h * 0.9, cx + gap + w * 0.55, cy + h);
    ctx.quadraticCurveTo(cx + gap + w * 0.1, cy + h * 1.1, cx + gap, cy + h * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  // ── HANDLEBAR ────────────────────────────────────────────
  function drawHandlebar(ctx, keypoints, scale) {
    const noseBase   = lm(keypoints, 94);
    const lipTop     = lm(keypoints, 0);
    const leftCorner  = lm(keypoints, 61);
    const rightCorner = lm(keypoints, 291);

    const cx = (noseBase.x + lipTop.x) / 2;
    const cy = (noseBase.y + lipTop.y) / 2;
    const mouthW = Math.abs(rightCorner.x - leftCorner.x);
    const w = mouthW * 0.55 * scale;
    const h = w * 0.18;

    ctx.save();
    ctx.strokeStyle = '#2a1a0a';
    ctx.lineWidth = h;
    ctx.lineCap = 'round';

    // Center bar
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.08, cy);
    ctx.lineTo(cx + w * 0.08, cy);
    ctx.stroke();

    // Left curl
    ctx.lineWidth = h * 0.85;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.08, cy);
    ctx.bezierCurveTo(cx - w * 0.4, cy - h * 0.5, cx - w, cy - h, cx - w, cy + h * 1.5);
    ctx.bezierCurveTo(cx - w, cy + h * 3, cx - w * 0.7, cy + h * 3.2, cx - w * 0.6, cy + h * 2.5);
    ctx.stroke();

    // Right curl
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.08, cy);
    ctx.bezierCurveTo(cx + w * 0.4, cy - h * 0.5, cx + w, cy - h, cx + w, cy + h * 1.5);
    ctx.bezierCurveTo(cx + w, cy + h * 3, cx + w * 0.7, cy + h * 3.2, cx + w * 0.6, cy + h * 2.5);
    ctx.stroke();

    ctx.restore();
  }

  // ── WALRUS ────────────────────────────────────────────────
  function drawWalrus(ctx, keypoints, scale) {
    const noseBase   = lm(keypoints, 94);
    const lipTop     = lm(keypoints, 0);
    const leftCorner  = lm(keypoints, 61);
    const rightCorner = lm(keypoints, 291);

    const cx = (noseBase.x + lipTop.x) / 2;
    const cy = noseBase.y;
    const mouthW = Math.abs(rightCorner.x - leftCorner.x);
    const w = mouthW * 0.62 * scale;
    const h = w * 0.55;

    ctx.save();
    ctx.fillStyle = '#3a2510';

    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.3, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // droop
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.5, cy + h * 0.3);
    ctx.quadraticCurveTo(cx - w * 0.5, cy + h * 0.9, cx - w * 0.3, cy + h);
    ctx.lineTo(cx - w * 0.2, cy + h * 0.8);
    ctx.quadraticCurveTo(cx - w * 0.45, cy + h * 0.7, cx - w * 0.45, cy + h * 0.3);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx + w * 0.5, cy + h * 0.3);
    ctx.quadraticCurveTo(cx + w * 0.5, cy + h * 0.9, cx + w * 0.3, cy + h);
    ctx.lineTo(cx + w * 0.2, cy + h * 0.8);
    ctx.quadraticCurveTo(cx + w * 0.45, cy + h * 0.7, cx + w * 0.45, cy + h * 0.3);
    ctx.fill();

    ctx.restore();
  }

  // ── CHEVRON ───────────────────────────────────────────────
  function drawChevron(ctx, keypoints, scale) {
    const noseBase   = lm(keypoints, 94);
    const lipTop     = lm(keypoints, 0);
    const leftCorner  = lm(keypoints, 61);
    const rightCorner = lm(keypoints, 291);

    const cx = (noseBase.x + lipTop.x) / 2;
    const cy = (noseBase.y + lipTop.y) / 2;
    const mouthW = Math.abs(rightCorner.x - leftCorner.x);
    const w = mouthW * 0.52 * scale;
    const h = w * 0.28;

    ctx.save();
    ctx.fillStyle = '#1e1008';

    ctx.beginPath();
    ctx.moveTo(cx - w, cy - h * 0.3);
    ctx.lineTo(cx + w, cy - h * 0.3);
    ctx.lineTo(cx + w, cy + h * 0.8);
    ctx.lineTo(cx, cy + h * 1.4);
    ctx.lineTo(cx - w, cy + h * 0.8);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // ── FU MANCHU ─────────────────────────────────────────────
  function drawFuManchu(ctx, keypoints, scale) {
    const noseBase   = lm(keypoints, 94);
    const lipTop     = lm(keypoints, 0);
    const leftCorner  = lm(keypoints, 61);
    const rightCorner = lm(keypoints, 291);
    const chin       = lm(keypoints, 152);

    const cx = (noseBase.x + lipTop.x) / 2;
    const cy = (noseBase.y + lipTop.y) / 2;
    const mouthW = Math.abs(rightCorner.x - leftCorner.x);
    const w = mouthW * 0.48 * scale;
    const h = w * 0.2;
    const dropLen = Math.abs(chin.y - lipTop.y) * 0.7 * scale;

    ctx.save();
    ctx.fillStyle = '#1e1008';
    ctx.strokeStyle = '#1e1008';
    ctx.lineWidth = h * 0.5;
    ctx.lineCap = 'round';

    // Top bar
    ctx.beginPath();
    ctx.rect(cx - w, cy - h * 0.5, w * 2, h);
    ctx.fill();

    // Left drop
    ctx.beginPath();
    ctx.moveTo(cx - w + h * 0.5, cy + h * 0.5);
    ctx.lineTo(cx - w + h * 0.5, cy + dropLen);
    ctx.stroke();

    // Right drop
    ctx.beginPath();
    ctx.moveTo(cx + w - h * 0.5, cy + h * 0.5);
    ctx.lineTo(cx + w - h * 0.5, cy + dropLen);
    ctx.stroke();

    ctx.restore();
  }

  // render loop is now inside btn-start click handler

  // ── Style selector ──────────────────────────────────────
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
    });
  });

  // ── Size slider ─────────────────────────────────────────
  sizeSlider.addEventListener('input', () => {
    sizeMultiplier = parseFloat(sizeSlider.value);
  });

  // ── Capture ─────────────────────────────────────────────
  document.getElementById('btn-capture').addEventListener('click', () => {
    const snap = document.createElement('canvas');
    snap.width  = overlay.width;
    snap.height = overlay.height;
    const sCtx = snap.getContext('2d');

    // Draw mirrored video
    sCtx.save();
    sCtx.scale(-1, 1);
    sCtx.drawImage(video, -snap.width, 0, snap.width, snap.height);
    sCtx.restore();

    // Overlay moustache (overlay canvas is already in mirrored coords)
    sCtx.drawImage(overlay, 0, 0);

    const dataUrl = snap.toDataURL('image/jpeg', 0.92);
    document.getElementById('snapshot-img').src = dataUrl;
    document.getElementById('snapshot-wrap').classList.add('show');
  });

  document.getElementById('snap-close').addEventListener('click', () => {
    document.getElementById('snapshot-wrap').classList.remove('show');
  });

  document.getElementById('snap-save').addEventListener('click', () => {
    const img = document.getElementById('snapshot-img');
    const a = document.createElement('a');
    a.href = img.src;
    a.download = 'moustache_' + Date.now() + '.jpg';
    a.click();
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    sizeSlider.value = 1.0;
    sizeMultiplier = 1.0;
  });

  document.getElementById('btn-share').addEventListener('click', async () => {
    if (navigator.share) {
      const snap = document.createElement('canvas');
      snap.width  = overlay.width;
      snap.height = overlay.height;
      const sCtx = snap.getContext('2d');
      sCtx.save();
      sCtx.scale(-1, 1);
      sCtx.drawImage(video, -snap.width, 0, snap.width, snap.height);
      sCtx.restore();
      sCtx.drawImage(overlay, 0, 0);

      snap.toBlob(async blob => {
        try {
          await navigator.share({ files: [new File([blob], 'moustache.jpg', { type: 'image/jpeg' })], title: 'My Moustache!' });
        } catch(e) {}
      }, 'image/jpeg', 0.9);
    } else {
      alert('Share not supported on this browser. Use Save instead.');
    }
  });

})();
</script>
