<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MoustacheCam</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1008;
  --cream: #f5efe4;
  --gold: #c9a84c;
  --rust: #8b3a1a;
}

html, body {
  height: 100%; width: 100%;
  background: var(--ink);
  color: var(--cream);
  font-family: 'Lato', sans-serif;
  overflow: hidden;
  touch-action: none;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
header {
  width: 100%;
  padding: 12px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #0e0a04;
  z-index: 10;
  flex-shrink: 0;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--gold);
}
header h1 span { color: var(--cream); }

#mode-toggle {
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  background: rgba(201,168,76,0.12);
  border: 1px solid rgba(201,168,76,0.4);
  border-radius: 20px;
  padding: 5px 10px;
  cursor: pointer;
}

/* VIEWPORT */
#viewport {
  position: relative;
  width: 100%;
  flex: 1;
  overflow: hidden;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

video {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

canvas#overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
}

/* Status pill */
#status {
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  background: rgba(14,10,4,0.8);
  border: 1px solid var(--gold);
  color: var(--gold);
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 14px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  white-space: nowrap;
  display: none;
}

/* Manual drag handle */
#drag-handle {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(201,168,76,0.25);
  border: 2px dashed var(--gold);
  z-index: 15;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 0.52rem;
  color: var(--gold);
  letter-spacing: 0.05em;
  text-align: center;
  cursor: grab;
  touch-action: none;
  user-select: none;
  transform: translate(-50%, -50%);
  line-height: 1.3;
}
#drag-handle.visible { display: flex; }

/* START SCREEN */
#start-screen {
  position: absolute;
  inset: 0; z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: rgba(14,10,4,0.95);
  padding: 30px;
  text-align: center;
}

#start-screen h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  color: var(--gold);
}

#start-screen p {
  font-size: 0.82rem;
  color: var(--cream);
  opacity: 0.7;
  max-width: 270px;
  line-height: 1.7;
}

#btn-start {
  padding: 15px 38px;
  border-radius: 40px;
  border: 2px solid var(--gold);
  background: var(--gold);
  color: var(--ink);
  font-family: 'Lato', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
}

#error-msg {
  display: none;
  background: rgba(139,58,26,0.3);
  border: 1px solid var(--rust);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 0.76rem;
  color: #ffaa88;
  max-width: 280px;
  line-height: 1.5;
  text-align: left;
}

/* LOADER */
#loader {
  position: absolute;
  inset: 0; z-index: 35;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(14,10,4,0.85);
  color: var(--gold);
}

.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(201,168,76,0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#loader-text {
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.85;
}

/* BOTTOM PANEL */
#panel {
  width: 100%;
  background: #0e0a04;
  padding: 10px 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
  z-index: 10;
}

#style-label {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  text-align: center;
  opacity: 0.6;
}

#style-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  scrollbar-width: none;
}
#style-scroll::-webkit-scrollbar { display: none; }

.style-btn {
  flex-shrink: 0;
  background: rgba(245,239,228,0.06);
  border: 1.5px solid rgba(201,168,76,0.25);
  border-radius: 10px;
  padding: 7px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--cream);
  min-width: 72px;
  transition: all 0.15s;
}
.style-btn.active {
  border-color: var(--gold);
  background: rgba(201,168,76,0.15);
  box-shadow: 0 0 10px rgba(201,168,76,0.25);
}
.style-icon { font-size: 1.3rem; line-height: 1; }
.style-name { font-size: 0.56rem; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.65; text-align: center; }

#controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
}

#size-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 160px;
}
#size-row label {
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.65;
  flex-shrink: 0;
}
input[type=range] {
  -webkit-appearance: none;
  height: 3px;
  background: rgba(201,168,76,0.3);
  border-radius: 2px;
  flex: 1;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--gold);
  cursor: pointer;
}

#actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

#btn-capture {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--cream);
  color: var(--ink);
  border: none;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  box-shadow: 0 0 0 4px rgba(245,239,228,0.15), 0 4px 16px rgba(0,0,0,0.5);
}
#btn-capture:active { transform: scale(0.92); }
.cam-icon { font-size: 1.3rem; }

.icon-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(245,239,228,0.07);
  border: 1.5px solid rgba(245,239,228,0.18);
  color: var(--cream);
  font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn:active { transform: scale(0.9); }

/* SNAPSHOT PREVIEW */
#snapshot-wrap {
  display: none;
  position: fixed;
  inset: 0; z-index: 100;
  background: rgba(14,10,4,0.94);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 20px;
}
#snapshot-wrap.show { display: flex; }

#snapshot-img {
  max-width: 100%;
  max-height: 58vh;
  border-radius: 14px;
  border: 2px solid var(--gold);
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

#snap-actions { display: flex; gap: 12px; }

.snap-btn {
  padding: 12px 26px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  font-family: 'Lato', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
}
#snap-save { background: var(--gold); color: var(--ink); }
#snap-close { background: rgba(245,239,228,0.1); color: var(--cream); border: 1.5px solid rgba(245,239,228,0.2); }
</style>
</head>
<body>

<header>
  <h1>Moustache<span>Cam</span></h1>
  <button id="mode-toggle">Manual Mode</button>
</header>

<div id="viewport">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status">Point camera at face</div>
  <div id="drag-handle" id="drag-handle">DRAG<br>ME</div>

  <div id="start-screen">
    <h2>🎩 MoustacheCam</h2>
    <p>Tap to start your camera.<br>The AI will detect your face and place the moustache automatically.<br><br>If detection fails, tap <strong>Manual Mode</strong> to drag it into position.</p>
    <button id="btn-start">📷 Start Camera</button>
    <div id="error-msg"></div>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">Starting…</div>
  </div>
</div>

<div id="panel">
  <div id="style-label">Choose Your Moustache</div>
  <div id="style-scroll">
    <button class="style-btn active" data-style="pencil">
      <span class="style-icon">〜〜</span>
      <span class="style-name">Parted Pencil</span>
    </button>
    <button class="style-btn" data-style="handlebar">
      <span class="style-icon">✦✦</span>
      <span class="style-name">Handlebar</span>
    </button>
    <button class="style-btn" data-style="walrus">
      <span class="style-icon">▬▬</span>
      <span class="style-name">Walrus</span>
    </button>
    <button class="style-btn" data-style="chevron">
      <span class="style-icon">▼▼</span>
      <span class="style-name">Chevron</span>
    </button>
    <button class="style-btn" data-style="fu_manchu">
      <span class="style-icon">⌐⌐</span>
      <span class="style-name">Fu Manchu</span>
    </button>
  </div>

  <div id="controls-row">
    <div id="size-row">
      <label>Size</label>
      <input type="range" id="size-slider" min="0.4" max="2.2" step="0.05" value="1.0">
    </div>
    <div id="actions">
      <button class="icon-btn" id="btn-flip" title="Flip camera">🔄</button>
      <button id="btn-capture">
        <span class="cam-icon">📷</span>
        <span>Snap</span>
      </button>
      <button class="icon-btn" id="btn-save-live" title="Save photo">💾</button>
    </div>
  </div>
</div>

<div id="snapshot-wrap">
  <img id="snapshot-img" alt="Your moustache photo">
  <div id="snap-actions">
    <button class="snap-btn" id="snap-save">💾 Save</button>
    <button class="snap-btn" id="snap-close">✕ Back</button>
  </div>
</div>

<!-- TF.js + BlazeFace: much lighter and more reliable on mobile than full FaceMesh -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.js"></script>

<script>
(async () => {

  const video        = document.getElementById('video');
  const overlay      = document.getElementById('overlay');
  const ctx          = overlay.getContext('2d');
  const statusEl     = document.getElementById('status');
  const loader       = document.getElementById('loader');
  const loaderText   = document.getElementById('loader-text');
  const startScreen  = document.getElementById('start-screen');
  const errorMsg     = document.getElementById('error-msg');
  const dragHandle   = document.getElementById('drag-handle');
  const sizeSlider   = document.getElementById('size-slider');
  const modeToggle   = document.getElementById('mode-toggle');

  let detector    = null;
  let currentStyle = 'pencil';
  let sizeScale   = 1.0;
  let manualMode  = false;
  let facingMode  = 'user';

  // Manual position as fraction of viewport (0–1)
  let manualX = 0.5;
  let manualY = 0.52;

  // ── Utilities ─────────────────────────────────────────────
  function showLoader(msg) {
    loader.style.display = 'flex';
    loaderText.textContent = msg;
  }
  function hideLoader() { loader.style.display = 'none'; }

  function showError(msg) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = '⚠ ' + msg;
    hideLoader();
  }

  // Keep canvas logical resolution = video resolution
  function syncCanvas() {
    if (video.videoWidth > 0) {
      overlay.width  = video.videoWidth;
      overlay.height = video.videoHeight;
    }
  }

  // ── Camera start (requires user gesture) ─────────────────
  document.getElementById('btn-start').addEventListener('click', async () => {
    startScreen.style.display = 'none';
    showLoader('Requesting camera…');

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (e) {
      startScreen.style.display = 'flex';
      showError('Camera error: ' + e.name + '. Please tap Allow when the browser asks for camera permission.');
      return;
    }

    video.srcObject = stream;
    try { await video.play(); } catch(e) { /* some browsers throw here, ignore */ }

    // Wait until video has real dimensions
    await new Promise(res => {
      const check = () => {
        if (video.videoWidth > 0) return res();
        setTimeout(check, 100);
      };
      check();
      setTimeout(res, 5000); // hard fallback
    });

    syncCanvas();
    statusEl.style.display = 'block';

    // Load BlazeFace
    showLoader('Loading face AI… (may take 10–20s on first load)');
    try {
      detector = await blazeface.load();
    } catch (e) {
      showError('AI model failed: ' + e.message + '. Check your internet connection.');
      return;
    }

    hideLoader();
    statusEl.textContent = 'Point camera at your face';
    renderLoop();
  });

  // ── Render loop ───────────────────────────────────────────
  async function renderLoop() {
    syncCanvas();
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (manualMode) {
      const vRect = document.getElementById('viewport').getBoundingClientRect();
      // Scale manual position to current canvas resolution
      const cx = manualX * overlay.width;
      const cy = manualY * overlay.height;
      const hw = overlay.width * 0.18 * sizeScale;
      drawMoustache(ctx, cx, cy, hw, currentStyle);
      statusEl.textContent = 'Manual — drag the circle to position';

    } else if (detector && video.readyState >= 2 && overlay.width > 0) {
      try {
        // returnTensors: false = plain JS numbers, no GPU memory management needed
        const predictions = await detector.estimateFaces(video, false /* returnTensors */);

        if (predictions && predictions.length > 0) {
          statusEl.textContent = '✓ Face detected';
          const face = predictions[0];

          // BlazeFace landmarks order: [rightEye, leftEye, nose, mouth, rightEar, leftEar]
          const lm = face.landmarks;

          // Video is CSS-mirrored (scaleX(-1)) so we must flip X coords on the canvas
          const flipX = x => overlay.width - x;

          const noseX  = flipX(lm[2][0]);
          const noseY  = lm[2][1];
          const mouthX = flipX(lm[3][0]);
          const mouthY = lm[3][1];

          // Place moustache 35% of the way from nose to mouth
          const cx = (noseX + mouthX) / 2;
          const cy = noseY + (mouthY - noseY) * 0.35;

          // Derive width from face bounding box width
          const faceW = face.bottomRight[0] - face.topLeft[0];
          const hw    = faceW * 0.28 * sizeScale;

          drawMoustache(ctx, cx, cy, hw, currentStyle);
        } else {
          statusEl.textContent = 'No face found — try Manual Mode';
        }
      } catch (e) {
        // Skip this frame silently
      }
    }

    requestAnimationFrame(renderLoop);
  }

  // ── Moustache drawing functions ───────────────────────────
  // All take: ctx, cx (centre-x), cy (centre-y), hw (half-width)

  function drawMoustache(ctx, cx, cy, hw, style) {
    ctx.save();
    if (style === 'pencil')    drawPencil(ctx, cx, cy, hw);
    if (style === 'handlebar') drawHandlebar(ctx, cx, cy, hw);
    if (style === 'walrus')    drawWalrus(ctx, cx, cy, hw);
    if (style === 'chevron')   drawChevron(ctx, cx, cy, hw);
    if (style === 'fu_manchu') drawFuManchu(ctx, cx, cy, hw);
    ctx.restore();
  }

  function drawPencil(ctx, cx, cy, hw) {
    const h   = hw * 0.3;
    const gap = hw * 0.08;
    ctx.fillStyle   = '#2a1a0a';
    ctx.strokeStyle = '#1a0e05';
    ctx.lineWidth   = 0.8;

    // Left wing
    ctx.beginPath();
    ctx.moveTo(cx - gap, cy);
    ctx.quadraticCurveTo(cx - gap - hw * 0.5, cy - h * 0.8, cx - gap - hw, cy + h * 0.1);
    ctx.quadraticCurveTo(cx - gap - hw,        cy + h * 1.1, cx - gap - hw * 0.45, cy + h * 1.2);
    ctx.quadraticCurveTo(cx - gap - hw * 0.08, cy + h * 1.0, cx - gap, cy + h * 0.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Right wing (mirror)
    ctx.beginPath();
    ctx.moveTo(cx + gap, cy);
    ctx.quadraticCurveTo(cx + gap + hw * 0.5, cy - h * 0.8, cx + gap + hw, cy + h * 0.1);
    ctx.quadraticCurveTo(cx + gap + hw,        cy + h * 1.1, cx + gap + hw * 0.45, cy + h * 1.2);
    ctx.quadraticCurveTo(cx + gap + hw * 0.08, cy + h * 1.0, cx + gap, cy + h * 0.5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawHandlebar(ctx, cx, cy, hw) {
    const th = hw * 0.17;
    ctx.strokeStyle = '#2a1a0a';
    ctx.lineCap = 'round';

    ctx.lineWidth = th;
    ctx.beginPath();
    ctx.moveTo(cx - hw * 0.1, cy);
    ctx.lineTo(cx + hw * 0.1, cy);
    ctx.stroke();

    ctx.lineWidth = th * 0.75;
    // Left curl
    ctx.beginPath();
    ctx.moveTo(cx - hw * 0.1, cy);
    ctx.bezierCurveTo(cx - hw * 0.5, cy - th, cx - hw, cy - th * 0.5, cx - hw, cy + th * 2);
    ctx.bezierCurveTo(cx - hw, cy + th * 4, cx - hw * 0.65, cy + th * 4.5, cx - hw * 0.55, cy + th * 3.5);
    ctx.stroke();
    // Right curl
    ctx.beginPath();
    ctx.moveTo(cx + hw * 0.1, cy);
    ctx.bezierCurveTo(cx + hw * 0.5, cy - th, cx + hw, cy - th * 0.5, cx + hw, cy + th * 2);
    ctx.bezierCurveTo(cx + hw, cy + th * 4, cx + hw * 0.65, cy + th * 4.5, cx + hw * 0.55, cy + th * 3.5);
    ctx.stroke();
  }

  function drawWalrus(ctx, cx, cy, hw) {
    const h = hw * 0.65;
    ctx.fillStyle = '#3a2510';
    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.15, hw * 0.92, h * 0.48, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#3a2510';
    ctx.lineCap = 'round';
    ctx.lineWidth = h * 0.28;
    [-hw * 0.52, hw * 0.52].forEach(dx => {
      ctx.beginPath();
      ctx.moveTo(cx + dx, cy + h * 0.52);
      ctx.lineTo(cx + dx, cy + h * 1.25);
      ctx.stroke();
    });
  }

  function drawChevron(ctx, cx, cy, hw) {
    const h = hw * 0.4;
    ctx.fillStyle = '#1e1008';
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy - h * 0.15);
    ctx.lineTo(cx + hw, cy - h * 0.15);
    ctx.lineTo(cx + hw, cy + h * 0.7);
    ctx.lineTo(cx,      cy + h * 1.4);
    ctx.lineTo(cx - hw, cy + h * 0.7);
    ctx.closePath();
    ctx.fill();
  }

  function drawFuManchu(ctx, cx, cy, hw) {
    const h    = hw * 0.22;
    const drop = hw * 1.7;
    ctx.fillStyle   = '#1e1008';
    ctx.strokeStyle = '#1e1008';
    ctx.lineCap = 'round';

    ctx.fillRect(cx - hw, cy - h * 0.5, hw * 2, h);

    ctx.lineWidth = h * 0.55;
    [cx - hw + h * 0.35, cx + hw - h * 0.35].forEach(dx => {
      ctx.beginPath();
      ctx.moveTo(dx, cy + h * 0.5);
      ctx.lineTo(dx, cy + drop);
      ctx.stroke();
    });
  }

  // ── Style selector ────────────────────────────────────────
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
    });
  });

  sizeSlider.addEventListener('input', () => {
    sizeScale = parseFloat(sizeSlider.value);
  });

  // ── Manual / Auto mode toggle ─────────────────────────────
  modeToggle.addEventListener('click', () => {
    manualMode = !manualMode;
    modeToggle.textContent = manualMode ? 'Auto Mode' : 'Manual Mode';
    dragHandle.classList.toggle('visible', manualMode);
    if (manualMode) updateHandlePos();
  });

  // ── Drag handle ───────────────────────────────────────────
  const viewport = document.getElementById('viewport');

  function updateHandlePos() {
    const r = viewport.getBoundingClientRect();
    dragHandle.style.left = (manualX * r.width)  + 'px';
    dragHandle.style.top  = (manualY * r.height) + 'px';
  }

  let dragging = false, dsx, dsy, dmx, dmy;

  dragHandle.addEventListener('mousedown',  e => { e.preventDefault(); dragging=true; dsx=e.clientX; dsy=e.clientY; dmx=manualX; dmy=manualY; });
  dragHandle.addEventListener('touchstart', e => { e.preventDefault(); dragging=true; dsx=e.touches[0].clientX; dsy=e.touches[0].clientY; dmx=manualX; dmy=manualY; }, { passive: false });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const r = viewport.getBoundingClientRect();
    manualX = Math.min(1, Math.max(0, dmx + (e.clientX - dsx) / r.width));
    manualY = Math.min(1, Math.max(0, dmy + (e.clientY - dsy) / r.height));
    updateHandlePos();
  });
  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    manualX = Math.min(1, Math.max(0, dmx + (e.touches[0].clientX - dsx) / r.width));
    manualY = Math.min(1, Math.max(0, dmy + (e.touches[0].clientY - dsy) / r.height));
    updateHandlePos();
  }, { passive: false });
  window.addEventListener('mouseup',  () => dragging = false);
  window.addEventListener('touchend', () => dragging = false);

  // ── Capture & save ────────────────────────────────────────
  function compositeFrame() {
    const w = video.videoWidth  || overlay.width;
    const h = video.videoHeight || overlay.height;
    if (!w || !h) return null;

    const snap = document.createElement('canvas');
    snap.width = w; snap.height = h;
    const sCtx = snap.getContext('2d');

    // Draw mirrored video
    sCtx.save();
    sCtx.translate(w, 0);
    sCtx.scale(-1, 1);
    sCtx.drawImage(video, 0, 0, w, h);
    sCtx.restore();

    // Draw moustache overlay (overlay canvas coords already account for mirroring)
    sCtx.drawImage(overlay, 0, 0, w, h);

    return snap.toDataURL('image/jpeg', 0.93);
  }

  document.getElementById('btn-capture').addEventListener('click', () => {
    const url = compositeFrame();
    if (!url) return;
    document.getElementById('snapshot-img').src = url;
    document.getElementById('snapshot-wrap').classList.add('show');
  });

  document.getElementById('btn-save-live').addEventListener('click', () => {
    const url = compositeFrame();
    if (!url) return;
    const a = document.createElement('a'); a.href = url;
    a.download = 'moustache_' + Date.now() + '.jpg'; a.click();
  });

  document.getElementById('snap-save').addEventListener('click', () => {
    const img = document.getElementById('snapshot-img');
    const a = document.createElement('a'); a.href = img.src;
    a.download = 'moustache_' + Date.now() + '.jpg'; a.click();
  });

  document.getElementById('snap-close').addEventListener('click', () => {
    document.getElementById('snapshot-wrap').classList.remove('show');
  });

  // ── Camera flip ───────────────────────────────────────────
  document.getElementById('btn-flip').addEventListener('click', async () => {
    if (!video.srcObject) return;
    video.srcObject.getTracks().forEach(t => t.stop());
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
      });
      video.srcObject = stream;
      await video.play();
    } catch(e) { /* rear camera may not exist, ignore */ }
  });

})();
</script>
</body>
</html>
